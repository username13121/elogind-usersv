[workspace]
members = [
    "crates/core",
    "crates/protocol",
    "daemon",
    "pam",
    "pam-config",
    "supervisor",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0.100"
env_logger = "0.11.8"
futures-util = "0.3.31"
libc = "0.2.180"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tokio = "1.53.1"
toml = "0.9.8"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
